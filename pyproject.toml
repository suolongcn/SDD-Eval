[project]
name = "sdd-eval"
version = "0.1.0"
description = "Evaluation toolkit for SDD workflows"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "httpx>=0.27", "typer>=0.12"]
[project.scripts]
sdd-eval = "sdd_eval.cli:app"
[tool.pytest.ini_options]
testpaths = ["tests"]
