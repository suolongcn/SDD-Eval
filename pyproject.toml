[project]
name = "sdd-eval"
version = "2.0.0"
description = "SWE-bench-compatible executable-oracle evaluation platform for SDD agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "httpx>=0.27", "typer>=0.12"]
[project.urls]
Homepage = "https://github.com/suolongcn/SDD-Eval"
Repository = "https://github.com/suolongcn/SDD-Eval"
Issues = "https://github.com/suolongcn/SDD-Eval/issues"
[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]
[project.scripts]
sdd-eval = "sdd_eval.cli:app"
[tool.pytest.ini_options]
testpaths = ["tests"]
