<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDD Eval</title><style>body{margin:0;background:#f4f6f8;color:#17202a;font:14px system-ui}header{padding:24px 6%;background:#17202a;color:#fff}main{max-width:1200px;margin:auto;padding:20px}.tabs,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.tabs{background:#fff;padding:5px;border-radius:8px;margin-bottom:16px}.tab,.action{border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600}.tab{background:#fff;color:#667085}.tab.active{background:#e8efff;color:#1d4ed8}.action{background:#2563eb;color:#fff}.action.secondary{background:#eef2f7;color:#344054}.danger{background:#fff0f0;color:#c43232;border:1px solid #fecaca;border-radius:5px;padding:6px 9px;cursor:pointer}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel,.modal-box{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:18px;box-shadow:0 2px 8px #17202a0a}.panel{margin-bottom:16px}.label{color:#667085;font-size:12px;text-transform:uppercase}.number{font-size:30px;font-weight:750}input,select{padding:9px;border:1px solid #cbd5e1;border-radius:6px;min-width:180px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th{font-size:12px;color:#667085;text-transform:uppercase}pre{white-space:pre-wrap;max-height:420px;overflow:auto;background:#101828;color:#e5e7eb;padding:12px;border-radius:6px}.modal{display:none;position:fixed;inset:0;background:#10182899;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-box{width:min(1100px,96vw);max-height:92vh;overflow:auto;position:relative}.modal-close{position:absolute;right:16px;top:12px;border:0;border-radius:50%;width:32px;height:32px;font-size:20px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto;white-space:nowrap}}
</style><header><h1>SDD Eval</h1><p>Spec-driven development evaluation workspace</p></header><main><nav class="tabs"><button class="tab active" data-view="overview">Overview</button><button class="tab" data-view="cases">Test Cases</button><button class="tab" data-view="runs">Runs</button></nav><section id="overview" class="view active"><div class="grid" id="cards"></div><div class="panel"><h2>Recent runs</h2><table id="recent"></table></div></section><section id="cases" class="view"><div class="panel"><nav class="tabs sub-tabs"><button class="tab active" data-run-view="single-run">Single task</button><button class="tab" data-run-view="batch-run">Batch compare</button></nav><div id="single-run"><h2>Run a test case</h2><div class="toolbar"><input id="taskId" placeholder="Task ID"><select id="client"><option value="codex">Codex CLI</option><option value="opencode">OpenCode CLI</option></select><select id="model"><option value="gpt-5.6-luna">Luna</option><option value="gpt-5.6-terra">Terra</option><option value="gpt-5.6-sol">Sol</option></select><select id="tool"><option value="openspec">OpenSpec</option><option value="superpowers">Superpowers</option></select><button class="action" id="execute">Run task</button><span id="message"></span></div></div><div id="batch-run" style="display:none"><h2>Compare models</h2><div class="toolbar"><input id="batchTaskId" placeholder="Task ID"><select id="batchClient"><option value="codex">Codex CLI</option><option value="opencode">OpenCode CLI</option></select><select id="batchModel" multiple size="6"></select><select id="batchTool"><option value="openspec">OpenSpec</option><option value="superpowers">Superpowers</option></select><button class="action" id="batchExecute">Run and compare</button><span id="batchMessage"></span></div><div id="batchReport"></div></div></div><div class="panel"><h2>Test cases</h2><table id="taskTable"></table></div></section><section id="runs" class="view"><div class="panel"><h2>All runs</h2><table id="runTable"></table></div></section></main><div id="detailModal" class="modal"><div class="modal-box"><button class="modal-close" onclick="closeDetails()">&times;</button><div id="detail"></div></div></div><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tasks=[],runs=[];const fd=v=>v?new Date(v).toLocaleString():'-',dur=v=>v==null?'-':Math.floor(v/1000)+'s';
const projectSource=t=>{const provider=String(t.reference_provider||'').toLowerCase(),repo=String(t.repository||'');const match=repo.match(/(?:https?:\/\/)?(?:www\.)?(github|gitee|gitcode)\.com\//i);const id=provider.match(/^(github|gitee|gitcode)$/)?.[1]||match?.[1]?.toLowerCase();const labels={github:'GitHub',gitee:'Gitee',gitcode:'GitCode'};if(!id)return {label:'Unknown',url:repo};return {label:labels[id]||id,url:repo};};
document.querySelectorAll('.tab[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-view]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.view).classList.add('active')});
async function load(){[tasks,runs]=await Promise.all([fetch('/api/tasks').then(r=>r.json()),fetch('/api/runs').then(r=>r.json())]);runs.sort((a,b)=>new Date(b.started_at||0)-new Date(a.started_at||0));$('#cards').innerHTML=`<div class="card"><div class="label">Test cases</div><div class="number">${tasks.length}</div></div><div class="card"><div class="label">Runs</div><div class="number">${runs.length}</div></div><div class="card"><div class="label">Average score</div><div class="number">${runs.length?(runs.reduce((n,x)=>n+(x.score||0),0)/runs.length).toFixed(1):'-'}</div></div><div class="card"><div class="label">Tokens</div><div class="number">${runs.reduce((n,x)=>n+(x.token_usage?.input_tokens||0)+(x.token_usage?.output_tokens||0),0)}</div></div>`;$('#recent').innerHTML='<tr><th>Run</th><th>Task</th><th>Started</th><th>Duration</th><th>Score</th><th></th></tr>'+runs.slice(0,8).map(x=>`<tr><td>${esc(x.run_id)}</td><td>${esc(x.task_id)}</td><td>${fd(x.started_at)}</td><td>${dur(x.duration_ms)}</td><td>${x.score??'-'}</td><td><button class="action secondary" onclick="showRun('${esc(x.run_id)}')">Details</button></td></tr>`).join('');$('#taskTable').innerHTML='<tr><th>ID</th><th>Title</th><th>Created</th><th>Project source</th><th>Code size</th><th>Reference Issue</th><th>Actions</th></tr>'+tasks.map(t=>{const source=projectSource(t),issue=t.source_issue_url,lines=t.reference_code_lines??t.reference_changed_lines,size=lines==null?'<span title="Code size unavailable">Not collected</span>':esc(`${lines} ${t.reference_code_estimated?'estimated lines':'changed lines'}`);return `<tr><td>${esc(t.id)}</td><td>${esc(t.title)}</td><td>${fd(t.created_at)}</td><td><span class="source source-${source.label.toLowerCase()}">${esc(source.label)}</span>${source.url?`<a class="repo-link" href="${esc(source.url)}" target="_blank" rel="noopener">${esc(t.repository||'Repository')}</a>`:''}</td><td>${size}</td><td>${issue?`<a href="${esc(issue)}" target="_blank" rel="noopener">Issue #${esc(t.source_issue_number??'')}</a>`:'<span title="No linked issue for this task">No issue linked</span>'}</td><td><button class="action secondary" onclick="selectTask('${esc(t.id)}')">Run</button> <button class="danger" type="button" aria-label="Delete ${esc(t.id)}" onclick="deleteTask('${esc(t.id)}')">Delete</button></td></tr>`}).join('');$('#runTable').innerHTML='<tr><th>Run</th><th>Task</th><th>Status</th><th>Started</th><th>Duration</th><th>Score</th><th></th></tr>'+runs.map(x=>`<tr><td>${esc(x.run_id)}</td><td>${esc(x.task_id)}</td><td>${esc(x.status)}</td><td>${fd(x.started_at)}</td><td>${dur(x.duration_ms)}</td><td>${x.score??'-'}</td><td><button class="action secondary" onclick="showRun('${esc(x.run_id)}')">Details</button></td></tr>`).join('')}
function selectTask(id){$('#taskId').value=id;document.querySelector('[data-view=cases]').click()}async function deleteTask(id){if(!window.confirm('Delete test case '+id+'? Its saved runs will also be removed.'))return;const response=await fetch('/api/tasks/'+encodeURIComponent(id),{method:'DELETE'});let data={};try{data=await response.json()}catch(e){}if(!response.ok){$('#message').textContent=data.detail||'Delete failed';return}if($('#taskId').value.trim()===id)$('#taskId').value='';$('#message').textContent='Deleted '+id;await load()}function closeDetails(){$('#detailModal').classList.remove('open')}$('#detailModal').onclick=e=>{if(e.target.id==='detailModal')closeDetails()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetails()});async function showRun(id){let x=await fetch('/api/runs/'+encodeURIComponent(id)).then(r=>r.json()),a=x.artifacts||{},docs=a.documents||{},v=x.validation||{},ref=a.reference||{},referenceHtml=ref.url?`<p>Reference: <a href="${esc(ref.url)}" target="_blank" rel="noopener">${esc(ref.url)}</a> | Code size: ${ref.code_lines==null?'-':esc(ref.code_lines+' '+(ref.code_lines_estimated?'estimated lines':'changed lines'))}</p>`:'';$('#detail').innerHTML=`<h2>Run ${esc(x.run_id)}</h2><p>Status: ${esc(x.status)} | Score: ${x.score??'-'} | Started: ${fd(x.started_at)} | Finished: ${fd(x.finished_at)} | Duration: ${dur(x.duration_ms)}</p>${referenceHtml}<p>Model: ${esc(x.token_usage.provider)} | Input tokens: ${x.token_usage.input_tokens} | Output tokens: ${x.token_usage.output_tokens} | Build: ${v.build_passed} | Tests: ${v.tests_passed}</p><h3>Execution steps (${(x.steps||[]).length})</h3><table>${(x.steps||[]).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.status)}</td><td>${s.duration_ms} ms</td><td>${esc(s.detail)}</td></tr>`).join('')}</table>${a.execution_log?`<h3>Console execution log</h3><pre class="console-log">${esc(a.execution_log)}</pre>`:'<h3>Console execution log</h3><p>No console log captured.</p>'}<h3>Scoring evidence</h3><table>${(x.scoring_basis||[]).map(s=>`<tr><td>${esc(s.dimension)}</td><td>${s.weight}%</td><td>${s.score??'-'}</td><td>${esc(s.basis)}</td></tr>`).join('')}</table><h3>Generated documents</h3>${Object.entries(docs).map(([n,c])=>`<h4>${esc(n)}</h4><pre>${esc(c)}</pre>`).join('')||'<p>No documents.</p>'}<h3>Generated code</h3><pre>${esc(a.generated_code||'No generated code.')}</pre>`;$('#detailModal').classList.add('open')}
$('#batchExecute').onclick=async()=>{let id=$('#batchTaskId').value.trim(),models=[...$('#batchModel').selectedOptions].map(o=>o.value);if(!id||!models.length)return;let r=await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,client:$('#batchClient').value,model:models[0],models,tool:$('#batchTool').value})});$('#batchMessage').textContent=r.ok?'Completed':'Failed';await load()};async function loadCapabilities(){try{let c=await fetch('/api/capabilities').then(r=>r.json()),tools=c.tools||[],sel=$('#tool');if(sel&&tools.length){sel.innerHTML='';tools.forEach(t=>{let o=document.createElement('option');o.value=t.id;o.textContent=t.id+(t.available?'':' (unavailable)');o.disabled=!t.available;sel.appendChild(o)})}}catch(e){}}const modelSelect=$('#model'),clientSelect=$('#client');clientSelect.setAttribute('aria-label','Client');modelSelect.setAttribute('aria-label','Model');$('#execute').onclick=async()=>{let id=$('#taskId').value.trim(),client=clientSelect.value,model=modelSelect.value,tool=$('#tool').value;if(!id)return;$('#message').textContent='Running...';let r=await fetch('/api/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,client,model,tool})}),d=await r.json();$('#message').textContent=r.ok?'Completed':(d.detail||'Failed');await load();if(r.ok&&d.run_id)showRun(d.run_id)};const compareButton=$("#compare");if(compareButton)compareButton.onclick=async()=>{let ids=window.prompt('Enter run IDs separated by commas');if(!ids)return;let r=await fetch('/api/runs/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ids.split(',').map(x=>x.trim()).filter(Boolean))}),d=await r.json();showComparison(d)};function showComparison(rows){$("#detail").innerHTML='<h2>Run comparison</h2><table><tr><th>Run</th><th>Model</th><th>Score</th><th>Document</th><th>Code</th><th>Tests</th><th>Reference</th><th>Efficiency</th></tr>'+rows.map(x=>'<tr>'+['run_id','model','score','document','code','tests','reference','efficiency'].map(k=>'<td>'+esc(x[k])+'</td>').join('')+'</tr>').join('')+'</table>';$("#detailModal").classList.add('open')}document.querySelectorAll('[data-run-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-run-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('#single-run,#batch-run').forEach(x=>x.style.display=x.id===b.dataset.runView?'block':'none')});loadCapabilities();load();</script></html>
